name: Check exporter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r static-garden/requirements.txt
      - run: python -m unittest discover -s static-garden -p 'test_*.py' -v
      - run: python static-garden/build.py --source examples/minimal --output dist
